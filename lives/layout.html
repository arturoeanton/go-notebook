<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <span class="sidebar-title">Notebooks</span>
            <button type="button" class="btn btn-icon" title="New notebook" onclick="nbCreate()">+</button>
        </div>
        <ul class="nb-list" id="nb_list"></ul>
    </aside>
    <div class="app-main">
        <header class="topbar">
            <div class="brand">
                <button type="button" class="btn btn-icon sidebar-toggle" title="Toggle sidebar" onclick="nbToggleSidebar()">☰</button>
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="18" rx="4"/>
                    <path d="M7 9l3 3-3 3"/>
                    <line x1="12" y1="15" x2="17" y2="15"/>
                </svg>
                <span class="brand-name">Go Notebook</span>
                <span class="notebook-chip" id="notebook_name"></span>
            </div>
            <nav class="toolbar">
                {{ mount "link_add_code"}}
                {{mount "link_add_md"}}
                {{mount "link_reload"}}
                <select id="snippet" class="select" onchange="send_event('link_add_code','Click', this.value); this.value=''">
                    <option value="">Insert snippet…</option>
                </select>
                <button type="button" class="btn" title="Export this notebook as a standalone HTML page" onclick="nbExport()">Export</button>
                <button type="button" class="btn" title="Show interpreter variables" onclick="nbToggleVars()">Vars</button>
                <button type="button" class="btn btn-icon" id="theme_toggle" title="Toggle dark mode" onclick="nbToggleTheme()">◐</button>
            </nav>
        </header>
        <main id="main_div" class="cells"></main>
    </div>
    <aside class="vars-panel vars-panel--hidden" id="vars_panel">
        <div class="vars-head">
            <span class="sidebar-title">Variables</span>
            <button type="button" class="ghost-btn" onclick="nbToggleVars()">✕</button>
        </div>
        <div id="vars_body" class="vars-body">
            <div class="vars-empty">No variables yet — run a cell.</div>
        </div>
    </aside>
</div>
